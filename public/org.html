<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TE Connectivity - Org Design</title>
  <meta name="description" content="Org Design workspace — current and target org structure, decisions and flight-risk tracked per position.">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css?v=1791625638">
  <script src="/js/transitions.js?v=1791700100"></script>
  <style>
    .org-wrap{ max-width:1100px; margin:0 auto; }
    .org-hero{ margin-bottom:1.25rem; }
    .org-hero h1{ font-size:1.9rem; color:var(--te-dark-teal); margin:0 0 .35rem; }
    .org-hero p{ color:var(--text-secondary); max-width:820px; line-height:1.55; margin:0; }
    /* Design Tension 4: two plain-text toggle labels — absent entirely
       (never a disabled pair) when the capability probe carries no
       restricted key; no fixed width so a longer translation reflows. */
    .org-state-switch{ display:flex; gap:.9rem; margin-top:.6rem; }
    .org-state-switch:empty{ margin-top:0; }
    .org-state-switch-label{ font-size:.68rem; font-weight:800; color:var(--text-dim); cursor:pointer; padding-bottom:.15rem; border-bottom:2px solid transparent; }
    .org-state-switch-label--active{ color:var(--te-dark-teal); border-bottom-color:var(--te-dark-teal); }
    .org-node{ position:relative; background:var(--card-bg,#fff); border:1px solid var(--border-color); border-radius:10px; padding:.65rem .9rem; margin-bottom:.5rem; }
    .org-node[data-depth="0"]{ box-shadow:var(--shadow-sm); }
    .org-node-row{ display:flex; align-items:flex-start; gap:.5rem; flex-wrap:wrap; }
    .org-node-toggle{ background:none; border:none; cursor:pointer; font-size:.8rem; color:var(--text-dim); padding:0 .3rem 0 0; }
    .org-node-main{ flex:1 1 160px; min-width:0; }
    .org-node-title{ font-size:.86rem; font-weight:600; color:var(--text-primary); line-height:1.4; }
    .org-node-level{ display:inline-block; font-size:.64rem; font-weight:800; background:var(--bg-light); color:var(--text-dim); border-radius:12px; padding:.15rem .55rem; margin-right:.5rem; }
    .org-node-occupant{ font-size:.78rem; color:var(--text-dim); margin-left:.4rem; }
    .org-node-vacant{ font-style:italic; }
    .org-node-delete{ margin-left:auto; background:none; border:none; cursor:pointer; font-size:.7rem; font-weight:700; color:var(--text-dim); padding:.1rem .3rem; }
    .org-node-delete:hover{ color:#EF4444; }
    /* Design Tension 1/2: indent rail as a left border on the children
       container; Tension 2's indent cap stops added padding past depth 6
       (--cap-desktop), tightened to depth 3 below 768px (--cap-narrow,
       scoped inside the media block below). The border-left rail itself
       keeps running at every depth — only the padding growth stops. */
    .org-node-children{ margin-top:.5rem; padding-left:1.25rem; border-left:1px solid var(--border-color); }
    .org-node-children.org-node-children--cap-desktop{ padding-left:0; }
    .org-add{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; background:var(--card-bg,#fff); border:1px dashed var(--border-color); border-radius:10px; padding:.6rem .9rem; margin-top:.6rem; }
    .org-add input, .org-add select{ padding:.4rem .65rem; border:1.5px solid var(--border-color); border-radius:8px; font-family:inherit; font-size:.8rem; }
    .org-add input[type="text"]{ flex:1; min-width:200px; }
    .org-add-error{ display:none; width:100%; font-size:.76rem; color:#C0392B; margin-top:.2rem; }
    .org-empty{ font-size:.8rem; color:var(--text-dim); font-style:italic; padding:.4rem 0; }
    /* Search (Design Tension 2): single-line field styled like
       .dd-add input[type="text"] (due-diligence.html:27-28); non-matching
       siblings are de-emphasised via .org-node--dim rather than removed. */
    .org-search{ margin-bottom:.6rem; }
    .org-search-input{ width:100%; padding:.4rem .65rem; border:1.5px solid var(--border-color); border-radius:8px; font-family:inherit; font-size:.8rem; box-sizing:border-box; }
    .org-node--dim{ opacity:.45; }
    /* Unassigned employees (Design Tension 2): a flat list, deliberately
       not a tree — these records have no position and therefore no parent. */
    .org-unassigned{ margin-top:1rem; }
    .org-unassigned-heading{ font-size:.85rem; font-weight:800; color:var(--te-dark-teal); margin:0 0 .4rem; }
    .org-unassigned-list{ display:flex; flex-direction:column; gap:.3rem; }
    .org-unassigned-row{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:baseline; background:var(--card-bg,#fff); border:1px solid var(--border-color); border-radius:8px; padding:.4rem .65rem; font-size:.78rem; }
    .org-unassigned-name{ font-weight:600; color:var(--text-primary); min-width:0; }
    .org-unassigned-meta{ color:var(--text-dim); font-size:.72rem; min-width:0; }
    /* Bulk paste importer (D-10) — styled like .org-add (dashed border) and
       #wiz-roster-raw (pmo.html:186 — monospace, .75rem, fixed rows with
       native scroll, never resized to fit content). The textarea stays
       full width at every breakpoint; only the action buttons stack below
       600px — no fixed width anywhere in this block so a longer
       translation reflows rather than clipping (i18n contract). */
    .org-import{ background:var(--card-bg,#fff); border:1px dashed var(--border-color); border-radius:10px; padding:.6rem .9rem; margin-top:.6rem; }
    .org-import-label{ display:block; font-size:.72rem; font-weight:700; color:var(--te-dark-teal); margin-bottom:.35rem; }
    .org-import-textarea{ width:100%; box-sizing:border-box; padding:.5rem; font-family:monospace; font-size:.75rem; border:1.5px solid var(--border-color); border-radius:8px; background:rgba(0,0,0,0.03); color:var(--text-main,var(--text-primary)); resize:vertical; }
    .org-import-error{ display:none; width:100%; font-size:.76rem; color:#C0392B; margin-top:.4rem; }
    .org-import-status{ display:none; width:100%; font-size:.76rem; color:#1E8449; margin-top:.4rem; }
    .org-import-actions{ display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.5rem; }
    /* Preview table — no fixed height anywhere: it scrolls with the page,
       not inside its own clipped container. */
    .org-import-preview{ margin-top:.6rem; }
    .org-import-preview-heading{ font-size:.78rem; font-weight:800; color:var(--te-dark-teal); margin:0 0 .35rem; }
    .org-import-preview-table{ width:100%; border-collapse:collapse; font-size:.74rem; }
    .org-import-preview-table th, .org-import-preview-table td{ text-align:left; padding:.3rem .5rem; border-bottom:1px solid var(--border-color); }
    .org-import-preview-table th{ color:var(--text-dim); font-weight:700; }
    @media (max-width:600px){
      .org-import-actions{ flex-direction:column; align-items:stretch; }
    }
    /* Design Tension 6: narrow-width org tree — card padding shrinks, and
       the indent cap tightens from depth 6 to depth 3 (3 * 1.25rem = 60px),
       leaving room for card content at a 320px viewport. */
    @media (max-width:768px){
      .org-node{ padding:.5rem .65rem; }
      .org-node-children.org-node-children--cap-narrow{ padding-left:0; }
    }
    /* Decision register (06-04, D-13/D-14, UI-SPEC Design Tension 5 /
       Surface Contract 5). The badge is a FILLED PILL only — the card
       border-accent channel stays reserved for flight-risk severity
       (Plan 05) so the two vocabularies never compete for the same visual
       channel. No fixed width and no clipping rule anywhere in this
       block — a longer translation must reflow the pill, never clip it,
       because the label IS the decision (i18n contract).
       Plan 08 Task 2 walk finding F4: this pill used to be
       `position:absolute; top:.55rem; right:.65rem;`, floating over
       whatever card content happened to sit at that fixed corner — a
       ~620-656px² intersection with the Delete button at 1280/768px on
       EVERY card, a collision with the Decisions button for longer labels
       (DE "Freigesetzt"), and a ~636-665px² intersection with the occupant
       name at 375px. It now PARTICIPATES IN LAYOUT FLOW instead: the wrap
       renders as its own right-aligned line above `.org-node-row`, so the
       badge can never overlap the interactive row or its text no matter
       how long the label is or how narrow the viewport gets. */
    .org-node-decision-wrap{ text-align:right; margin-bottom:.35rem; }
    .org-node-decision{ display:inline-block; flex:none; font-size:.64rem; font-weight:800; border-radius:12px; padding:.18rem .6rem; }
    .org-dec-badge--retain{ background:rgba(63,122,55,.12); color:#3f7a37; }
    .org-dec-badge--redeploy{ background:rgba(59,130,246,.12); color:var(--status-info,#3B82F6); }
    .org-dec-badge--in-selection{ background:rgba(233,131,0,.12); color:var(--te-orange); }
    .org-dec-badge--redundant{ background:rgba(192,57,43,.1); color:#C0392B; }
    .org-dec-badge--open{ background:var(--bg-light); color:var(--text-dim); }
    .org-node-history-toggle{ background:none; border:none; cursor:pointer; font-size:.7rem; font-weight:700; color:var(--text-dim); padding:.1rem .4rem; }
    .org-node-history-toggle:hover{ color:var(--te-dark-teal); }
    .org-dec-history{ margin-top:.6rem; padding-top:.5rem; border-top:1px dashed var(--border-color); }
    .org-dec-history-heading{ font-size:.78rem; font-weight:800; color:var(--te-dark-teal); margin:0 0 .4rem; }
    /* Reduced-size pill inside a history row — same modifier classes as
       .org-node-decision, smaller base sizing only. */
    .org-dec-row{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem; font-size:.78rem; padding:.35rem 0; border-bottom:1px dashed var(--border-color); }
    .org-dec-row-type{ flex:none; font-size:.6rem; font-weight:800; border-radius:10px; padding:.12rem .5rem; }
    .org-dec-row-rationale{ flex-basis:100%; color:var(--text-primary); line-height:1.4; }
    .org-dec-row-meta{ color:var(--text-dim); font-size:.7rem; }
    .org-dec-form{ display:flex; flex-direction:column; gap:.5rem; background:var(--card-bg,#fff); border:1px dashed var(--border-color); border-radius:10px; padding:.6rem .9rem; margin-top:.6rem; }
    .org-dec-form select, .org-dec-form textarea, .org-dec-form input{ padding:.4rem .65rem; border:1.5px solid var(--border-color); border-radius:8px; font-family:inherit; font-size:.8rem; }
    .org-dec-form textarea{ resize:vertical; }
    .org-dec-form-error{ display:none; font-size:.76rem; color:#C0392B; }
    /* Flight-risk register (06-05, D-15/D-16, UI-SPEC Design Tension 5 /
       Surface Contract 6). On the TREE card, severity is a BORDER-ACCENT
       (.org-node-risk) — reusing .dd-item--overdue's exact idiom
       (border-color + inset box-shadow, due-diligence.html:21) — never a
       second pill, so it never competes with the decision badge's filled-
       pill channel for the same corner. The register's own row mirrors
       .raid-row verbatim (execution.html:108); the level renders as a
       small text label (.org-risk-lvl, mirroring .raid-lvl verbatim,
       execution.html:114-115) since there is no competing badge on this
       standalone row. No fixed width and no clipping rule anywhere
       in this block — a longer translation must reflow, never clip. */
    .org-node-risk{ border-color:#C0392B; box-shadow:inset 0 0 0 1px rgba(192,57,43,.35); }
    .org-risk-register{ margin-top:1rem; }
    .org-risk-register-heading{ font-size:.85rem; font-weight:800; color:var(--te-dark-teal); margin:0 0 .4rem; }
    .org-risk-row{ display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; background:var(--card-bg,#fff); border:1px solid var(--border-color); border-radius:10px; padding:.6rem .9rem; margin-bottom:.45rem; }
    .org-risk-person{ font-size:.86rem; font-weight:600; color:var(--text-primary); }
    .org-risk-lvl{ font-size:.64rem; font-weight:800; }
    .org-risk-lvl.high{ color:#C0392B; } .org-risk-lvl.critical{ color:#C0392B; } .org-risk-lvl.medium{ color:#C77700; } .org-risk-lvl.low{ color:#3f7a37; }
    .org-risk-owner{ font-size:.78rem; color:var(--text-dim); }
    .org-risk-mitigation{ flex-basis:100%; font-size:.78rem; color:var(--text-primary); line-height:1.4; margin:0; }
    .org-risk-form{ display:flex; flex-direction:column; gap:.5rem; background:var(--card-bg,#fff); border:1px dashed var(--border-color); border-radius:10px; padding:.6rem .9rem; margin-top:.6rem; }
    .org-risk-form select, .org-risk-form textarea, .org-risk-form input{ padding:.4rem .65rem; border:1.5px solid var(--border-color); border-radius:8px; font-family:inherit; font-size:.8rem; }
    .org-risk-form textarea{ resize:vertical; }
    .org-risk-form-error{ display:none; font-size:.76rem; color:#C0392B; }
    /* Conversion controls (06-06, D-15/D-17, UI-SPEC Surface Contract 6).
       Buttons reuse .btn/.btn-secondary verbatim (no new button styling).
       .org-risk-linked mirrors this app's established small-pill idiom
       (e.g. .raid-type, execution.html:109-113) — due-diligence.js's own
       linked-pill markup carries no dedicated rule to copy, so this is a
       fresh declaration in the SAME visual language, not a divergent one.
       .org-risk-convert-note reuses .dd-finding-convert-note's exact
       treatment (due-diligence.html:43) so the corrected D-17 wording reads
       identically wherever it appears. No fixed width and no clipping rule
       anywhere in this block — a longer translation must reflow, never
       clip. */
    .org-risk-convert{ display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; flex-basis:100%; margin-top:.4rem; }
    .org-risk-linked{ font-size:.7rem; font-weight:700; color:#167987; background:rgba(22,121,135,.1); border:1px solid rgba(22,121,135,.3); border-radius:12px; padding:.15rem .55rem; }
    .org-risk-convert-note{ display:block; width:100%; font-size:.72rem; font-style:italic; color:var(--text-dim); margin-top:.2rem; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="main-header">
      <div class="brand-wrapper">
        <div class="brand-logo-container">
          <img class="brand-logo-svg" src="/te-logo.png" alt="TE Connectivity" style="height:36px;width:auto;display:block;">
        </div>
        <div class="brand-divider"></div>
        <div class="brand-title"><span class="portal-badge">M&amp;A Integration</span></div>
      </div>
      <nav class="navigation-bar">
        <a href="/" class="nav-link">Overview</a>
        <a href="/dashboard.html" class="nav-link">Integration Leader Portal</a>
      </nav>
    </header>

    <main class="main-content">
      <div class="org-wrap">
        <div class="org-hero">
          <h1>Org Design</h1>
          <p>The organization structure — vacant and filled positions, mapped current state.</p>
          <div id="org-state-switch" class="org-state-switch"></div>
        </div>
        <div id="org-search" class="org-search"></div>
        <div id="org-delete-error" class="org-add-error"></div>
        <div id="org-tree"></div>
        <div id="org-unassigned" class="org-unassigned"></div>
        <div id="org-add"></div>
        <div id="org-import"></div>
        <div id="org-risk-register" class="org-risk-register"></div>
      </div>
    </main>
  </div>

  <script src="/js/org.js?v=1791625638"></script>
</body>
</html>
