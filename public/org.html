<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TE Connectivity - Org Design</title>
  <meta name="description" content="Org Design workspace — current and target org structure, decisions and flight-risk tracked per position.">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css?v=1784600001">
  <script src="/js/transitions.js?v=1784900001"></script>
  <style>
    .org-wrap{ max-width:1100px; margin:0 auto; }
    .org-hero{ margin-bottom:1.25rem; }
    .org-hero h1{ font-size:1.9rem; color:var(--te-dark-teal); margin:0 0 .35rem; }
    .org-hero p{ color:var(--text-secondary); max-width:820px; line-height:1.55; margin:0; }
    .org-node{ position:relative; background:var(--card-bg,#fff); border:1px solid var(--border-color); border-radius:10px; padding:.65rem .9rem; margin-bottom:.5rem; }
    .org-node[data-depth="0"]{ box-shadow:var(--shadow-sm); }
    .org-node-row{ display:flex; align-items:flex-start; gap:.5rem; flex-wrap:wrap; }
    .org-node-toggle{ background:none; border:none; cursor:pointer; font-size:.8rem; color:var(--text-dim); padding:0 .3rem 0 0; }
    .org-node-main{ flex:1 1 160px; min-width:0; }
    .org-node-title{ font-size:.86rem; font-weight:600; color:var(--text-primary); line-height:1.4; }
    .org-node-level{ display:inline-block; font-size:.64rem; font-weight:800; background:var(--bg-light); color:var(--text-dim); border-radius:12px; padding:.15rem .55rem; margin-right:.5rem; }
    .org-node-occupant{ font-size:.78rem; color:var(--text-dim); margin-left:.4rem; }
    .org-node-vacant{ font-style:italic; }
    /* Design Tension 1/2: indent rail as a left border on the children
       container; Tension 2's indent cap stops added padding past depth 6
       (--cap-desktop), tightened to depth 3 below 768px (--cap-narrow,
       scoped inside the media block below). The border-left rail itself
       keeps running at every depth — only the padding growth stops. */
    .org-node-children{ margin-top:.5rem; padding-left:1.25rem; border-left:1px solid var(--border-color); }
    .org-node-children.org-node-children--cap-desktop{ padding-left:0; }
    .org-add{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; background:var(--card-bg,#fff); border:1px dashed var(--border-color); border-radius:10px; padding:.6rem .9rem; margin-top:.6rem; }
    .org-add input, .org-add select{ padding:.4rem .65rem; border:1.5px solid var(--border-color); border-radius:8px; font-family:inherit; font-size:.8rem; }
    .org-add input[type="text"]{ flex:1; min-width:200px; }
    .org-add-error{ display:none; width:100%; font-size:.76rem; color:#C0392B; margin-top:.2rem; }
    .org-empty{ font-size:.8rem; color:var(--text-dim); font-style:italic; padding:.4rem 0; }
    /* Design Tension 6: narrow-width org tree — card padding shrinks, and
       the indent cap tightens from depth 6 to depth 3 (3 * 1.25rem = 60px),
       leaving room for card content at a 320px viewport. */
    @media (max-width:768px){
      .org-node{ padding:.5rem .65rem; }
      .org-node-children.org-node-children--cap-narrow{ padding-left:0; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="main-header">
      <div class="brand-wrapper">
        <div class="brand-logo-container">
          <img class="brand-logo-svg" src="/te-logo.png" alt="TE Connectivity" style="height:36px;width:auto;display:block;">
        </div>
        <div class="brand-divider"></div>
        <div class="brand-title"><span class="portal-badge">M&amp;A Integration</span></div>
      </div>
      <nav class="navigation-bar">
        <a href="/" class="nav-link">Overview</a>
        <a href="/dashboard.html" class="nav-link">Integration Leader Portal</a>
      </nav>
    </header>

    <main class="main-content">
      <div class="org-wrap">
        <div class="org-hero">
          <h1>Org Design</h1>
          <p>The organization structure — vacant and filled positions, mapped current state.</p>
        </div>
        <div id="org-tree"></div>
        <div id="org-add"></div>
      </div>
    </main>
  </div>

  <script src="/js/org.js?v=1784900003"></script>
</body>
</html>
