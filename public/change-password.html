<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TE Connectivity - Change password</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css?v=1791625638">
  <style>
    body{ display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#f3f6f7,#e8eef0); }
    .cp-card{ background:#fff; border:1px solid var(--border-color,#dde3e6); border-radius:16px; padding:2.25rem 2.5rem; width:100%; max-width:420px; box-shadow:0 24px 60px rgba(9,17,22,.14); box-sizing:border-box; }
    .cp-card img{ height:40px; margin-bottom:1.25rem; }
    .cp-card h1{ font-size:1.25rem; color:var(--te-dark-teal,#244C5A); margin:0 0 .35rem; }
    .cp-card p{ font-size:.85rem; color:var(--text-secondary,#5b666c); margin:0 0 1.4rem; line-height:1.5; }
    .cp-field{ margin-bottom:1rem; }
    .cp-field label{ display:block; font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim,#7a848a); margin-bottom:.35rem; }
    .cp-field input{ width:100%; padding:.65rem .85rem; border:1.5px solid var(--border-color,#dde3e6); border-radius:8px; font-family:inherit; font-size:.95rem; box-sizing:border-box; }
    .cp-field input:focus{ outline:none; border-color:var(--te-orange,#E98300); }
    .cp-field input:disabled{ background:var(--bg-subtle,#f4f7f8); cursor:not-allowed; }
    .cp-btn{ width:100%; padding:.7rem; border:none; border-radius:8px; background:var(--te-orange,#E98300); color:#fff; font-family:inherit; font-size:.95rem; font-weight:800; cursor:pointer; }
    .cp-btn:hover{ filter:brightness(1.05); }
    .cp-btn:disabled{ opacity:.5; cursor:not-allowed; filter:none; }
    .cp-btn-quiet{ margin-top:.6rem; background:transparent; color:var(--te-dark-teal,#244C5A); border:1.5px solid var(--border-color,#dde3e6); }
    .cp-card p.cp-notice{ display:none; color:#C0392B; font-size:.82rem; font-weight:700; margin:.8rem 0 0; }
    .cp-card p.cp-readonly{ display:none; background:var(--bg-subtle,#f4f7f8); border:1px solid var(--border-color,#dde3e6); border-radius:8px; padding:.6rem .75rem; margin:0 0 1rem; font-size:.8rem; }
    .cp-hint{ font-size:.74rem; color:var(--text-dim,#7a848a); margin:-.5rem 0 1rem; }
    @media (max-width:480px){ body{ padding:.75rem; box-sizing:border-box; } .cp-card{ padding:1.5rem 1.25rem; } }
  </style>
</head>
<body>
  <div class="cp-card">
    <img src="/te-logo.png" alt="TE Connectivity">
    <h1 id="cp-title">Change password</h1>
    <p id="cp-intro">Choose a new password for your account.</p>
    <p id="cp-readonly" class="cp-readonly" role="status"></p>
    <form id="cp-form">
      <div class="cp-field"><label for="cp-current">Current password</label><input id="cp-current" type="password" autocomplete="current-password" autofocus></div>
      <div class="cp-field"><label for="cp-new">New password</label><input id="cp-new" type="password" autocomplete="new-password"></div>
      <div class="cp-hint" id="cp-hint"></div>
      <div class="cp-field"><label for="cp-confirm">Confirm new password</label><input id="cp-confirm" type="password" autocomplete="new-password"></div>
      <button class="cp-btn" id="cp-submit" type="submit">Change password</button>
      <p id="cp-notice" class="cp-notice" role="alert"></p>
    </form>
    <button class="cp-btn cp-btn-quiet" id="cp-signout" type="button">Sign out</button>
  </div>
  <script src="/js/client-storage.js?v=1"></script>
  <script src="/js/change-password.js?v=1791700105"></script>
</body>
</html>
